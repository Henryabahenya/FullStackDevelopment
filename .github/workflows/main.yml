name: Build and Test Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./PART_8/fs-graphql/library-backend
        run: |
          npm install

      - name: Run tests
        working-directory: ./PART_8/fs-graphql/library-backend
        run: |
          npm test --if-present
